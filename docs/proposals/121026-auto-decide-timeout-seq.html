<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto-decide Timeout</title>
<style>
:root{
  --field-a:#e8f1ff;--field-b:#f7fbff;--field-c:#dbe9ff;
  --glass:rgba(255,255,255,.62);--glass-edge:rgba(255,255,255,.9);--glass-shadow:rgba(40,80,160,.14);
  --ink:#14213d;--ink-2:#4a5878;--line:#c9d6ee;
  --legacy:#4f46e5;--add:#059669;--block:#d97706;--accent:#2563eb;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --field-a:#0b1222;--field-b:#111a30;--field-c:#0d1a36;
  --glass:rgba(30,41,66,.6);--glass-edge:rgba(255,255,255,.12);--glass-shadow:rgba(0,0,0,.4);
  --ink:#e6ecf8;--ink-2:#a6b3cf;--line:#33415f;
  --legacy:#818cf8;--add:#34d399;--block:#fbbf24;--accent:#60a5fa;}}
:root[data-theme="dark"]{
  --field-a:#0b1222;--field-b:#111a30;--field-c:#0d1a36;
  --glass:rgba(30,41,66,.6);--glass-edge:rgba(255,255,255,.12);--glass-shadow:rgba(0,0,0,.4);
  --ink:#e6ecf8;--ink-2:#a6b3cf;--line:#33415f;
  --legacy:#818cf8;--add:#34d399;--block:#fbbf24;--accent:#60a5fa;}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 600px at 10% -10%,var(--field-c),transparent 60%),
             radial-gradient(900px 500px at 110% 10%,var(--field-c),transparent 60%),
             linear-gradient(180deg,var(--field-a),var(--field-b));background-attachment:fixed;min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:32px 16px 64px}
.window{background:var(--glass);border:1px solid var(--glass-edge);border-radius:18px;box-shadow:0 10px 40px var(--glass-shadow),inset 0 1px 0 var(--glass-edge);
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);overflow:hidden}
.chrome{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:50%}.r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
.chrome span{margin-left:10px;font-size:13px;color:var(--ink-2)}
.hero{padding:28px 28px 8px}
h1{font-size:28px;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--ink-2);margin:0 0 14px}
.legend{display:flex;flex-wrap:wrap;gap:10px;padding:0 28px 22px;font-size:13px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--glass)}
.sw{width:10px;height:10px;border-radius:3px}
section.task{margin:22px 0}
.card{padding:22px 24px}
.card h2{margin:0 0 4px;font-size:19px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;margin-top:14px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.diagram-box{border:1px solid var(--line);border-radius:14px;padding:10px;background:color-mix(in srgb,var(--glass) 70%,transparent);cursor:pointer;overflow-x:auto}
.diagram-box svg{display:block;width:100%;min-width:460px;height:auto}
.msg{opacity:.85;transition:opacity .3s}
.msg.on{opacity:1}.msg.on line,.msg.on path{stroke-width:3}
.msg.on text{font-weight:700}
.prose p{margin:0 0 10px}
.prose .risk{border-left:3px solid var(--block);padding-left:10px;color:var(--ink-2)}
.hint{font-size:12px;color:var(--ink-2);margin-top:6px}
code{font:13px ui-monospace,SFMono-Regular,Consolas,monospace;background:color-mix(in srgb,var(--accent) 10%,transparent);padding:1px 5px;border-radius:5px}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="window">
    <div class="chrome"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i><span>121026-auto-decide-timeout — sequence</span></div>
    <div class="hero">
      <h1>Auto-decide: tự chọn khi user không trả lời</h1>
      <p class="sub">Spec: <a href="121026-auto-decide-timeout.md">121026-auto-decide-timeout.md</a> · Trạng thái: <b>proposed</b> · 8 task, mỗi task một sơ đồ. Bấm vào sơ đồ để tạm dừng/chạy tiếp phần tô sáng.</p>
    </div>
    <div class="legend">
      <span class="badge"><i class="sw" style="background:var(--legacy)"></i>có sẵn</span>
      <span class="badge"><i class="sw" style="background:var(--add)"></i>thêm / đổi</span>
      <span class="badge"><i class="sw" style="background:var(--block)"></i>chặn / lùi / lỗi</span>
    </div>
  </div>
  <div id="tasks"></div>
</div>
<script>
const TASKS = [
 {id:"T1",title:"Cấu hình auto_decide trong manifest",agent:"codex",
  parts:["User","integration.yaml","manifest.py","gen.py"],
  steps:[[0,1,"khai auto_decide {enabled, timeout_s}","add"],[2,1,"load() đọc khối mới","add"],[2,0,"timeout_s ngoài 10–3600 → từ chối","block"],[3,2,"render hook auto-decide","add"],[3,3,"entry kèm timeout = 3615","add"],[3,0,"gate --check: khớp manifest","legacy"]],
  prose:["Task này mở rộng manifest — nơi duy nhất khai mọi điểm nối với Claude Code — bằng một khối <code>auto_decide</code> gồm <code>enabled</code> (mặc định tắt) và <code>timeout_s</code> (mặc định 60). Hook mới <code>auto-decide</code> cũng được khai ở đây, gắn vào sự kiện PreToolUse với matcher <code>AskUserQuestion</code>, kèm câu assumption bắt buộc.",
   "Khi nạp manifest, <code>manifest.py</code> kiểm giá trị ngay: thời gian chờ phải là số nguyên trong khoảng 10 đến 3600 giây, sai thì từ chối nạp thay vì âm thầm dùng mặc định. Sau đó <code>gen.py</code> sinh entry hook có trường <code>timeout</code> đủ lớn (trần 3600 cộng 15 giây), vì nếu không Claude Code có thể giết hook trước khi thời gian chờ kết thúc.",
   "<span class='risk'>Rủi ro: thêm trường <code>timeout</code> làm settings đã cài ở các dự án khác bị báo lệch cho tới khi chạy lại gen hoặc <code>--add-new-hooks</code>.</span>"]},
 {id:"T2",title:"Lệnh CLI bật/tắt và đổi thời gian chờ",agent:"codex",
  parts:["User","cli.py","state/auto-decide.json","autodecide.effective"],
  steps:[[0,1,"auto-decide on --timeout 90","add"],[1,2,"ghi {enabled:true, timeout_s:90}","add"],[0,1,"auto-decide --timeout 5","add"],[1,0,"ngoài khoảng → từ chối","block"],[3,2,"đọc state (ưu tiên)","add"],[3,3,"không có state → giá trị manifest","legacy"]],
  prose:["User không phải sửa <code>integration.yaml</code> để bật tính năng. Lệnh <code>python -m coding_agent.cli auto-decide on|off|status [--timeout N]</code> ghi lựa chọn vào <code>.coding-agent/state/auto-decide.json</code>, theo repo chứ không theo phiên, nên bật một lần là dùng cho mọi phiên sau.",
   "Hàm <code>autodecide.effective</code> trả cấu hình đang có hiệu lực: giá trị trong file state thắng giá trị manifest; không có file state thì dùng manifest. Vì hook đọc giá trị này ở mỗi câu hỏi, thay đổi có hiệu lực ngay ở câu hỏi kế tiếp mà không cần sinh lại settings.",
   "<span class='risk'>Lý do không ghi vào manifest: sửa file cấu hình hook bị <code>coordinator-guard</code> bắt xác nhận — đúng cho việc đổi guard, nhưng thừa cho một công tắc tiện ích.</span>"]},
 {id:"T3",title:"Logic chọn phương án gợi ý (hàm thuần)",agent:"codex",
  parts:["Hook","autodecide.suggested","autodecide.is_sensitive"],
  steps:[[0,1,"questions[] từ AskUserQuestion","legacy"],[1,1,"tìm nhãn (Recommended)/(Khuyến nghị)","add"],[1,1,"không có → phương án đầu","add"],[0,2,"câu này có nhạy cảm?","add"],[2,0,"có → chỉ gắn cờ sensitive, vẫn tự chọn","add"],[1,0,"nhãn ngoài danh sách → loại","block"]],
  prose:["Phần quyết định dự phòng được tách thành hàm thuần để test không cần GUI hay Claude Code. <code>suggested</code> trả phương án agent đã gợi ý: nhãn có đánh dấu khuyến nghị, không có thì phương án đầu tiên; câu chọn nhiều thì lấy mọi phương án gợi ý. Đây là đáp án khi Fable không dùng được.",
   "Theo quyết định của user ngày 12/10, câu hỏi về xoá, ghi đè, commit/push hay gửi ra ngoài cũng được tự chọn như mọi câu khác và không ưu tiên phương án “an toàn”. <code>is_sensitive</code> chỉ gắn cờ <code>sensitive: true</code> vào ghi chú và event để user dễ rà lại, không chặn gì.",
   "<span class='risk'>Rủi ro đã được user chấp nhận: một thao tác phá huỷ có thể chạy khi user vắng mặt. Cờ sensitive trong events.jsonl là dấu vết để truy lại.</span>"]},
 {id:"T8",title:"Fable chọn khi hết giờ",agent:"claude",
  parts:["Hook","claude -p (Fable)","autodecide.valid_answer","suggested()"],
  steps:[[0,1,"câu hỏi + lựa chọn + ngữ cảnh lượt","add"],[1,0,"{nhãn, lý do}","add"],[0,2,"nhãn có trong danh sách?","add"],[2,0,"hợp lệ → dùng lựa chọn của Fable","add"],[0,3,"lỗi / quá 90s / nhãn lạ → phương án gợi ý","block"]],
  prose:["Khi hết thời gian chờ, hook không chọn máy móc ngay mà hỏi model Fable (<code>claude-fable-5-1</code>) qua Claude Code chạy headless: <code>claude -p --model claude-fable-5-1 --output-format json</code>. Cách này dùng phiên đăng nhập sẵn của user, không cần API key và không thêm thư viện.",
   "Prompt gửi Fable gồm câu hỏi, các lựa chọn, prompt gần nhất của user và phần cuối lượt hiện tại lấy từ transcript, và chỉ cho phép trả một nhãn có trong danh sách kèm một câu lý do. Lý do này đi vào ghi chú cho agent và event <code>auto-decided</code>, để user biết vì sao lựa chọn đó được chọn.",
   "<span class='risk'>Nếu Fable lỗi, quá 90 giây, lệnh <code>claude</code> không có trên PATH, hoặc trả nhãn ngoài danh sách, hook dùng phương án được agent gợi ý. User có thể tắt hẳn Fable bằng <code>--no-fable</code>.</span>"]},
 {id:"T4",title:"Cửa sổ đếm ngược",agent:"claude",
  parts:["Hook","subprocess popup","User"],
  steps:[[0,1,"python -m coding_agent.autodecide prompt (stdin)","add"],[1,2,"câu hỏi + nút + đồng hồ 60s","add"],[2,1,"bấm lựa chọn trong hạn","add"],[1,0,"{answers:…}","add"],[1,0,"hết giờ → {timeout:true}","add"],[1,0,"không display / thiếu tkinter → lỗi","block"]],
  prose:["Trong lúc hook chạy, terminal Claude Code đang bị giữ, nên user không thể gõ câu trả lời ở đó. Vì vậy câu hỏi được đưa ra một cửa sổ nhỏ luôn nằm trên cùng, viết bằng tkinter (có sẵn trong Python, đã kiểm trên máy Windows này), chạy như một tiến trình con riêng để lỗi GUI không làm sập hook.",
   "Cửa sổ hiện câu hỏi, một nút cho mỗi lựa chọn, nút “Chọn khuyến nghị ngay”, và đồng hồ đếm ngược. User bấm thì tiến trình in câu trả lời rồi thoát; hết giờ thì in <code>{\"timeout\": true}</code> và tự đóng. Hook vẫn giết tiến trình ở mốc thời gian chờ cộng 5 giây để không bao giờ treo phiên.",
   "<span class='risk'>Rủi ro: máy không có màn hình (SSH, CI) hoặc Python thiếu tkinter. Khi đó tiến trình báo lỗi và hook lùi về cách hỏi bình thường — không bao giờ tự chọn khi user không thấy câu hỏi.</span>"]},
 {id:"T5",title:"Hook auto-decide trên AskUserQuestion",agent:"claude",
  parts:["Claude Code","hook auto-decide","popup","events.jsonl"],
  steps:[[0,1,"PreToolUse AskUserQuestion","legacy"],[1,1,"effective(): tắt → không làm gì","legacy"],[1,2,"bật → mở popup","add"],[2,1,"answers, hoặc hết giờ → Fable → gợi ý","add"],[1,3,"auto-decided / answered-by-user","add"],[1,0,"allow + updatedInput.answers + ghi chú","add"],[1,0,"popup lỗi → hỏi thường (fallback)","block"]],
  prose:["Đây là chỗ ghép mọi phần. Khi agent gọi <code>AskUserQuestion</code>, hook đọc cấu hình hiệu lực; nếu tắt, nó trả output rỗng và Claude Code hỏi như hiện nay. Nếu bật, hook mở cửa sổ đếm ngược và chờ kết quả.",
   "Có câu trả lời (của user hoặc tự chọn), hook trả <code>permissionDecision: allow</code> kèm <code>updatedInput</code> chứa <code>answers</code>, nên tool chạy như thể user vừa chọn. Khi là tự chọn, hook thêm ghi chú để agent nói lại với user “đã tự chọn X sau 60 giây”, và ghi event <code>auto-decided</code> vào <code>events.jsonl</code>.",
   "<span class='risk'>Chưa kiểm chứng: Claude Code có nhận <code>answers</code> qua <code>updatedInput</code> của hook hay không. Nếu không, đường lùi là <code>deny</code> kèm lý do nêu rõ lựa chọn đã tự chọn để agent đi tiếp theo lựa chọn đó.</span>"]},
 {id:"T6",title:"Hợp đồng coordinator khi auto-decide bật",agent:"codex",
  parts:["SessionStart","coordinator.contract","Coordinator","User"],
  steps:[[0,1,"inject hợp đồng","legacy"],[1,1,"auto-decide bật → thêm 1 dòng","add"],[1,2,"hỏi bằng AskUserQuestion, khuyến nghị đứng đầu","add"],[2,3,"câu hỏi worker leo thang → có timeout","add"]],
  prose:["Hiện hợp đồng bảo coordinator “hỏi người dùng trong hội thoại” khi worker cần quyết định — thường là viết câu hỏi bằng văn bản rồi kết thúc lượt, và kiểu đó không có timeout nào. Khi auto-decide bật, hợp đồng thêm một dòng yêu cầu hỏi bằng <code>AskUserQuestion</code> và đặt phương án khuyến nghị (an toàn) lên đầu.",
   "Nhờ vậy câu hỏi của worker leo thang lên user cũng được hưởng thời gian chờ và tự chọn, mà không cần đổi cơ chế <code>orca orchestration ask/reply</code>. Khi auto-decide tắt, hợp đồng giữ nguyên từng chữ.",
   "<span class='risk'>Rủi ro thấp: model có thể không làm theo dòng hợp đồng; khi đó câu hỏi chỉ mất timeout, không sai hành vi.</span>"]},
 {id:"T7",title:"Test và README",agent:"codex",
  parts:["pytest","popup giả lập","gate"],
  steps:[[0,1,"CODING_AGENT_AUTODECIDE_FAKE=timeout|choice:2","add"],[1,0,"answers khuyến nghị / lựa chọn 2","add"],[0,0,"snapshot manifest + settings","add"],[0,2,"gate --manifest integration.yaml","legacy"],[2,0,"exit 0","legacy"]],
  prose:["Test không mở cửa sổ thật: một biến môi trường cho tiến trình popup trả ngay kết quả giả (hết giờ, hoặc user chọn phương án thứ hai, hoặc lỗi display). Như vậy test phủ đủ ba nhánh của hook — tự chọn, user thắng, và lùi về hỏi thường — cộng với kiểm khoảng của cấu hình và lệnh CLI.",
   "Snapshot manifest và settings sinh ra được cập nhật, cổng <code>gate</code> phải thoát 0, và README thêm mục “Auto-decide” hướng dẫn bật, đổi thời gian chờ và giải thích popup.",
   "<span class='risk'>Thử tay bắt buộc trên Windows với 60 giây trước khi đổi <code>verified</code>, vì test không chứng minh được hành vi của Claude Code thật.</span>"]}
];
const COLORS={legacy:"var(--legacy)",add:"var(--add)",block:"var(--block)"};
function svgFor(t){
  const W=640,colW=W/t.parts.length,top=46,gap=40,H=top+t.steps.length*gap+20;
  const x=i=>colW*i+colW/2;
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,sans-serif">`;
  s+=`<defs>${Object.keys(COLORS).map(k=>`<marker id="ar-${t.id}-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="${COLORS[k]}"/></marker>`).join("")}</defs>`;
  t.parts.forEach((p,i)=>{s+=`<rect x="${x(i)-colW/2+8}" y="6" width="${colW-16}" height="26" rx="8" fill="var(--glass)" stroke="var(--line)"/><text x="${x(i)}" y="24" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">${p}</text><line x1="${x(i)}" y1="32" x2="${x(i)}" y2="${H-6}" stroke="var(--line)" stroke-dasharray="4 4"/>`;});
  t.steps.forEach(([a,b,label,k],n)=>{
    const y=top+n*gap+14,c=COLORS[k];
    s+=`<g class="msg" data-n="${n}">`;
    if(a===b){s+=`<path d="M${x(a)},${y-8} h34 v16 h-30" fill="none" stroke="${c}" stroke-width="2" marker-end="url(#ar-${t.id}-${k})"/><text x="${x(a)+40}" y="${y+4}" font-size="11.5" fill="${c}">${label}</text>`;}
    else{const x1=x(a),x2=x(b);s+=`<line x1="${x1}" y1="${y}" x2="${x2+(x2>x1?-4:4)}" y2="${y}" stroke="${c}" stroke-width="2" marker-end="url(#ar-${t.id}-${k})"/><text x="${(x1+x2)/2}" y="${y-6}" text-anchor="middle" font-size="11.5" fill="${c}">${label}</text>`;}
    s+=`</g>`;
  });
  return s+`</svg>`;
}
const root=document.getElementById("tasks");
TASKS.forEach(t=>{
  const sec=document.createElement("section");sec.className="task window";
  sec.innerHTML=`<div class="card"><h2>${t.id} — ${t.title} <span class="badge" style="color:var(--accent)">agent: ${t.agent}</span></h2>
    <div class="grid"><div><div class="diagram-box">${svgFor(t)}</div><div class="hint">Tự tô sáng từng bước · bấm để dừng</div></div>
    <div class="prose">${t.prose.map(p=>`<p>${p}</p>`).join("")}</div></div></div>`;
  root.appendChild(sec);
  const box=sec.querySelector(".diagram-box"),msgs=[...box.querySelectorAll(".msg")];let i=0,paused=false;
  setInterval(()=>{if(paused)return;msgs.forEach(m=>m.classList.remove("on"));msgs[i%msgs.length].classList.add("on");i++;},1100);
  box.addEventListener("click",()=>paused=!paused);
});
</script>
</body>
</html>
