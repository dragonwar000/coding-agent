[project]
name = "coding-agent"
version = "0.1.0"
description = "Harness gắn chặt vào Claude Code CLI và Orca: một manifest, vòng đời có bằng chứng, bộ nhớ Zero-Mem."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
