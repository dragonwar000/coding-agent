# Manifest duy nhất của harness. Mọi điểm nối với Claude Code và Codex được khai ở đây,
# và `python -m coding_agent.gen` sinh cấu hình của từng công cụ từ file này.
schema: 1

# verified: false nghĩa là các ngưỡng và assumption trong file này là mặc định ước đoán, chưa đo trên phiên thật.
# ADAPT-CHECKLIST (finalize khi có phiên thật):
#   1. Chạy ở shadow ít nhất một tuần, rồi xem `python3 -m coding_agent.cli report`: số lần nhắc và chặn khớp hành vi thật.
#   2. Đối chiếu từng `remind-repeat` và `stop-*` với transcript: lặp đó là kẹt thật hay là đang làm việc.
#   3. Đo cấu trúc JSON thật của `orchestration task-list` và `task-create`: sửa `tasks_of` và `task_id_of` trong `orca_cli.py` nếu khác giả định.
#   4. Chỉ khi (1) đến (3) đạt và người duyệt đồng ý: đổi một guard sang `enforce`, rồi đặt `verified: true`.
verified: false

# Lệnh Python mà hook gọi. `python3` trên macOS và Linux; trên Windows thường là `python`.
python: python3

# Thư mục chứa package, tính từ gốc repo (nơi đặt manifest này). Đường dẫn tương đối, không tuyệt đối.
python_src: src

# Lệnh verify chạy ở sự kiện Stop. Rỗng nghĩa là không có bằng chứng nào: phán quyết là `skipped`, không bao giờ `ok`.
verify:
  commands:
    - "python3 -m pytest -q"
  timeout_s: 300
  max_continuations: 3
  # changed: chỉ verify lượt có sửa file (theo transcript và git status). always: mọi lượt.
  when: changed
  # root: chạy ở gốc repo. changed-repos: chạy trong từng git repo con có file bị sửa (workspace nhiều repo).
  scope: root

# Bộ nhớ của agent: Zero-Mem (zm) với quy tắc episode của memory-distill.
memory:
  ingest: both                 # conversation | episodes | both
  embedder: hash               # hash | default (default cần thư mục model của zm)
  change_tools: [Write, Edit, MultiEdit]
  transient_markers:
    - "this session"
    - "for now"
    - "today only"
    - "temporarily"
    - "for this turn"
    - "tạm thời"
    - "chỉ trong phiên này"
  max_episode_request_chars: 1000
  max_episode_outcome_chars: 2000
  max_episode_chars: 6000

# Ngưỡng của loop-guard và denial budget (Task 5). Ngưỡng bằng 0 nghĩa là tắt.
# ASSUMPTION: 3 lần lặp đúng một lời gọi là đủ để nhắc; 6 lần là đủ để dừng. Chưa đo trên phiên thật.
loop:
  remind_at: 3
  stop_at: 6
  max_tool_calls_per_turn: 400
  max_denials_per_turn: 5     # ASSUMPTION: 5 lượt gọi tool bị từ chối hoặc lỗi trong một lượt là đủ để dừng việc thử lại.

# Auto-decide (FR-001): agent hỏi user bằng AskUserQuestion thì chờ timeout_s giây; hết giờ thì Fable chọn
# (fable: true, tối đa fable_timeout_s giây), lùi về phương án được gợi ý. User bật/tắt bằng
# `python -m coding_agent.cli auto-decide on|off [--timeout N]`; giá trị đó ghi đè khối này.
# ASSUMPTION: 60 giây là đủ để một user đang ngồi máy kịp trả lời. Chưa đo trên phiên thật.
auto_decide:
  enabled: false
  timeout_s: 60
  fable: true
  fable_timeout_s: 90

# Ratchet (Graph Engineering §II, vòng autoresearch của Karpathy): trong phiên ghi file (worker, maintainer), mỗi lần
# Stop có verify đạt là một lần thử. Lần đạt đầu tiên của lượt là baseline; lần sau được giữ khi `metric` tốt hơn điểm
# tốt nhất quá `min_delta`, còn không thì cây file quay về bản đã giữ. Dừng sau `no_improve_stop` lần liên tiếp không
# cải thiện hoặc `max_trials_per_turn` lần thử. Snapshot là commit git qua index tạm: không đụng HEAD, nhánh, index của
# người dùng; mỗi lần thử có ref dưới `refs/coding-agent/ratchet/<session>/`. `metric` rỗng: ratchet không chạy ở mọi mode.
# Chỉ quay cây file và yêu cầu chạy tiếp khi cả ratchet và stop-gate ở enforce.
ratchet:
  mode: shadow
  assumption: "Số in ở dòng cuối của lệnh metric đo đúng chất lượng của việc; một lần thử có số kém hơn là thay đổi không đáng giữ."
  metric: ""                  # ví dụ: "python3 scripts/score.py" in một số ở dòng cuối
  direction: max              # max: số lớn hơn là tốt hơn; min: số nhỏ hơn là tốt hơn
  min_delta: 0
  no_improve_stop: 3          # ASSUMPTION: 3 lần liên tiếp không cải thiện là đủ để dừng thử
  max_trials_per_turn: 20
  metric_timeout_s: 600

# Evaluator (Graph Engineering §V, §VI.A): sau khi verify (và ratchet) đạt, một tiến trình `claude -p` mới, không thấy
# hội thoại, chấm lượt theo `rubric` (rỗng thì evaluator tự viết tiêu chí từ yêu cầu), chỉ dùng Read/Grep/Glob.
# grounding: mỗi tiêu chí báo đạt phải dẫn bằng chứng harness kiểm được (đường dẫn có thật trong workspace, hoặc đúng
# nguyên văn một lệnh verify đã đạt). enforce: tiêu chí chưa đạt hoặc thiếu bằng chứng làm lượt chạy tiếp, tối đa
# verify.max_continuations vòng. Chỉ chặn khi cả evaluator và stop-gate ở enforce.
evaluator:
  mode: shadow
  assumption: "Một evaluator mới, không thấy hội thoại và chỉ đọc workspace, phát hiện được việc chưa xong mà lệnh verify bỏ sót."
  rubric: []
  model: haiku
  timeout_s: 180              # ASSUMPTION: 3 phút là đủ để Haiku đọc workspace và trả báo cáo
  grounding: shadow

# Hook. `mode` có ba giá trị: off (không chạy), shadow (ghi quyết định, không chặn), enforce (được chặn).
# Mặc định là shadow (FR-010). Mọi hook không off bắt buộc có `assumption`: câu nêu điều hook giả định về model.
# Chỉ hook đã khai enforce mới được chặn. Hiện orca-guard (FR-009), stop-gate (SC-002) và coordinator-guard (bắt buộc chia việc theo graph) ở enforce.
hooks:
  - id: orca-guard
    host: [claude_code, codex]
    event: PreToolUse
    matcher: Bash
    mode: enforce
    assumption: "Lệnh orca task-update với status ngoài enum là sai và Orca sẽ trả ok:false lặng lẽ."
  - id: loop-guard
    host: [claude_code]
    event: PreToolUse
    matcher: "Write|Edit|MultiEdit|Bash"
    mode: shadow
    assumption: "Model lặp đúng một lời gọi tool với cùng tham số, hoặc gặp quá nhiều lời gọi bị từ chối, là đang bị kẹt, không phải đang làm việc."
  - id: prompt-reset
    host: [claude_code, codex]
    event: UserPromptSubmit
    mode: shadow
    assumption: "Mỗi prompt của người dùng bắt đầu một lượt mới; bộ đếm của lượt cũ không được mang sang."
  - id: stop-gate
    host: [claude_code]
    event: Stop
    mode: enforce
    assumption: "Lệnh verify là bằng chứng đủ để một lượt được coi là xong; câu trả lời của model thì không."
  - id: pre-compact
    host: [claude_code]
    event: PreCompact
    mode: shadow
    assumption: "Ghi nhận lúc nén ngữ cảnh là đủ để đối chiếu sau này; không cần sao chép gì khi nén."
  - id: session-restore
    host: [claude_code]
    event: SessionStart
    matcher: compact
    mode: shadow
    assumption: "Vài prompt gần nhất của người dùng là đủ để tiếp tục công việc sau khi nén ngữ cảnh."
  - id: coordinator-guard
    host: [claude_code]
    event: PreToolUse
    matcher: "Write|Edit|MultiEdit|NotebookEdit|Bash|Agent|Task"
    mode: enforce
    assumption: "Mọi thay đổi file của coordinator phải đi qua graph: worker Orca làm từng node trong worktree riêng. Coordinator chỉ ghi file plan và chạy lệnh của coding-agent."
  - id: coordinator-context
    host: [claude_code]
    event: SessionStart
    matcher: "startup|resume|clear|compact"
    mode: shadow
    assumption: "Hợp đồng coordinator và bảng việc đầu phiên là đủ để coordinator tiếp tục đúng vai sau khi khởi động hoặc nén ngữ cảnh."
  - id: coordinator-board
    host: [claude_code]
    event: UserPromptSubmit
    mode: shadow
    assumption: "Bảng việc đọc từ Orca ở mỗi prompt đủ mới để trả lời người dùng về tiến độ."
  - id: auto-decide
    host: [claude_code]
    event: PreToolUse
    matcher: AskUserQuestion
    mode: shadow
    # Phải lớn hơn timeout_s + fable_timeout_s tối đa (3600 + 600) để Claude Code không giết hook đang chờ.
    timeout_s: 4215
    assumption: "User đã bật auto-decide chấp nhận để agent tự chọn khi không trả lời trong thời gian chờ; phương án Fable chọn hoặc agent gợi ý là đủ tốt để chạy tiếp."
